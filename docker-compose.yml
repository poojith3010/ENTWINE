services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: entwine_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: entwine_twin
      POSTGRES_USER: entwine_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_now}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entwine_admin -d entwine_twin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  timescaledb_data:
    driver: local
